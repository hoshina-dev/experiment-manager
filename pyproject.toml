[project]
name = "experiment-manager"
version = "0.1.0"
description = "FastAPI service that stores and serves lab analysis templates for experiment management"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34",
    "fastapi>=0.136.1",
    "jsonschema>=4.21",
    "reportlab>=4.2",
    "opentelemetry-api>=1.41.1",
    "opentelemetry-instrumentation-fastapi>=0.62b1",
    "opentelemetry-sdk>=1.41.1",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.14.1",
    "scalar-fastapi>=1.8.2",
    "sqlalchemy[asyncio]>=2.0.0",
    "uvicorn[standard]>=0.46.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.42.1",
    "opentelemetry-instrumentation-sqlalchemy>=0.63b1",
    "opentelemetry-instrumentation-botocore>=0.63b1",
]

[dependency-groups]
dev = [
    "anyio>=4.0",
    "black>=26.3.1,<26.5",
    "httpx>=0.28.1",
    "isort>=8.0.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-bdd>=8.1.0,<9",
    "pytest-cov>=7.0.0,<8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = ["--strict-config", "--strict-markers"]
markers = [
    "unit: fast tests isolated from external services",
    "integration: tests that exercise the API or repository against PostgreSQL",
    "acceptance: Cucumber/Gherkin workflows through the public HTTP API",
]

[tool.isort]
profile = "black"

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
